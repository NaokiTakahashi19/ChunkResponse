<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#f8fbff" /><meta name="description" content="英語チャンク練習アプリ。" /><link rel="manifest" href="./manifest.webmanifest" /><link rel="stylesheet" href="./tokens.css" /><link rel="stylesheet" href="./styles.css" /><link rel="stylesheet" href="./practice.css" /><title>Chunk Response</title></head>
<body><div class="app-shell"><header class="app-header"><a class="brand" href="./" aria-label="Chunk Response ホーム">CHUNK <span>RESPONSE</span></a><div class="header-actions"><p id="asset-status" class="asset-status" role="status">教材を読み込んでいます…</p><button id="install-button" class="icon-button" type="button" hidden>アプリに追加</button></div></header><main>
<section class="control-row" aria-label="教材と練習モード"><div class="course-switch" role="group" aria-label="教材を選択"><button class="course-button is-selected" type="button" data-course="daily">日常／ビジネス</button><button class="course-button" type="button" data-course="edtech">EduTech／IT</button></div><button id="settings-button" class="icon-button" type="button" aria-expanded="false" aria-controls="settings-panel">設定 <span aria-hidden="true">⚙</span></button></section>
<section class="mode-tabs" role="tablist" aria-label="練習方法"><button class="mode-tab is-selected" type="button" role="tab" aria-selected="true" data-mode="listen">01 聞いて覚える</button><button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="recall">02 既習例文</button><button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="apply">03 応用</button></section>
<aside id="settings-panel" class="settings-panel" hidden><label>繰り返し回数<select id="repeat-count"><option value="1">1回</option><option value="2">2回</option><option value="3" selected>3回</option><option value="5">5回</option></select></label><label>文の間のポーズ<select id="pause-multiplier"><option value="0.7">70%</option><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.2">120%</option><option value="1.4">140%</option></select></label><p>「既習例文」では、英語音声の長さを基準にポーズ時間を決めます。</p></aside>
<section id="learning-card" class="learning-card" aria-live="polite"><div class="card-meta"><span id="mode-label">LISTEN &amp; REPEAT</span><span id="progress">—</span></div><p id="chunk-label" class="chunk-label">読み込み中</p><p id="japanese-text" class="japanese-text">教材データを準備しています。</p><h2 id="english-text" class="english-text">…</h2><div id="reveal-actions" class="rating-actions"><button id="show-japanese" class="secondary-button" type="button">日本語訳を確認</button><button id="show-english" class="secondary-button" type="button">英文を確認</button></div><p id="cue-text" class="cue-text">再生して、聞こえた通りに続けて話してください。</p><div class="card-actions is-play-only"><button id="previous-button" class="secondary-button" type="button" hidden>前へ</button><button id="play-button" class="primary-button" type="button" disabled><span aria-hidden="true">▶</span> 再生する</button><button id="next-button" class="secondary-button" type="button" hidden>次へ</button></div><div id="rating-actions" class="rating-actions" hidden><button id="cannot-button" class="rating-button is-cannot" type="button">← 言えなかった</button><button id="can-button" class="rating-button is-can" type="button">言えた →</button></div><p id="swipe-hint" class="swipe-hint" hidden>左へスワイプ：言えなかった　右へスワイプ：言えた</p></section>
<section class="queue-panel" aria-labelledby="queue-title" hidden><div><p class="overline">CURRENT SET</p><h2 id="queue-title">同じ型を続けて練習</h2></div><p id="queue-copy">例文は同じチャンクごとに並びます。</p><ol id="queue-list" class="queue-list"></ol></section></main></div><script src="./app.js"></script><script src="./course-loader.js"></script><script src="./load-status.js"></script><script src="./settings.js"></script><script src="./repeat-display.js"></script><script src="./auto-mode.js"></script><script src="./audio-controls.js"></script><script src="./progress.js"></script><script src="./reveal.js"></script><script src="./install.js"></script></body></html>
