<!doctype html>
<html lang="ja"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" /><meta name="theme-color" content="#f8fbff" /><meta name="description" content="英語チャンク練習アプリ。" /><link rel="icon" href="./icon.svg" type="image/svg+xml" /><link rel="manifest" href="./manifest.webmanifest" /><link rel="stylesheet" href="./tokens.css?v=25" /><link rel="stylesheet" href="./styles.css?v=25" /><link rel="stylesheet" href="./practice.css?v=25" /><title>Chunk Response</title></head>
<body><div class="app-shell"><header class="app-header"><a class="brand" href="./" aria-label="Chunk Response ホーム">CHUNK <span>RESPONSE</span></a><div class="header-actions"><p id="asset-status" class="asset-status" role="status">教材を選択して開始</p><button id="install-button" class="icon-button" type="button" hidden>アプリに追加</button></div></header><main>
<section class="control-row" aria-label="教材と表示"><div class="course-switch" role="group" aria-label="教材を選択"><button class="course-button" type="button" data-course="daily" aria-pressed="false">日常／ビジネス</button><button class="course-button" type="button" data-course="edtech" aria-pressed="false">EduTech／IT</button></div><div class="control-actions"><button id="examples-button" class="icon-button" type="button" aria-pressed="false" aria-controls="examples-view">例文一覧</button><button id="settings-button" class="icon-button" type="button" aria-expanded="false" aria-controls="settings-panel">設定 <span aria-hidden="true">⚙</span></button></div></section>
<aside id="settings-panel" class="settings-panel" hidden><label>繰り返し回数<select id="repeat-count"><option value="1">1回</option><option value="2">2回</option><option value="3" selected>3回</option><option value="5">5回</option></select></label><label id="repeat-pause-setting">リピーティングのポーズ<select id="pause-multiplier"><option value="0.7">70%</option><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.2">120%</option><option value="1.4">140%</option></select></label><p id="recall-pause-help">既習例文では、英文音声の長さに設定した秒数を加えて待ちます。</p></aside>
<div id="practice-view"><div class="practice-toolbar"><section class="mode-tabs" role="tablist" aria-label="練習方法"><button class="mode-tab is-selected" type="button" role="tab" aria-selected="true" data-mode="listen">01 聞いて覚える</button><button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="recall">02 既習例文</button><button class="mode-tab" type="button" role="tab" aria-selected="false" data-mode="apply">03 応用</button></section><label id="learning-range-setting" class="learning-range-setting">学習範囲<select id="learning-range"><option value="all">全120チャンク</option><option value="1-20">001–020</option><option value="21-40">021–040</option><option value="41-60">041–060</option><option value="61-80">061–080</option><option value="81-100">081–100</option><option value="101-120">101–120</option></select></label></div>
<section id="learning-card" class="learning-card" aria-live="polite"><div class="card-meta"><span id="mode-label">LISTEN &amp; REPEAT</span><span id="progress">—</span></div><div class="prompt-content"><p id="chunk-label" class="chunk-label">教材を選択</p><button id="hint-button" class="secondary-button hint-button" type="button" hidden>ヒントを見る</button><p id="japanese-text" class="japanese-text" hidden></p><h2 id="english-text" class="english-text" hidden></h2><div id="reveal-actions" class="reveal-actions" hidden><button id="show-japanese" class="secondary-button" type="button">日本語訳を確認</button><button id="show-english" class="secondary-button" type="button">英文を確認</button></div></div><div class="practice-controls"><p id="cue-text" class="cue-text">教材を選択してください。</p><div class="card-actions is-play-only"><button id="previous-button" class="secondary-button" type="button" hidden>前へ</button><button id="play-button" class="primary-button" type="button" disabled><span aria-hidden="true">▶</span> 再生する</button><button id="next-button" class="secondary-button" type="button" hidden>次へ</button></div><div id="rating-actions" class="rating-actions" hidden><button id="cannot-button" class="rating-button is-cannot" type="button">← 言えなかった</button><button id="can-button" class="rating-button is-can" type="button">言えた →</button></div><p id="swipe-hint" class="swipe-hint" hidden>左へスワイプ：言えなかった　右へスワイプ：言えた</p></div></section>
<section class="queue-panel" aria-labelledby="queue-title" hidden><div><p class="overline">CURRENT SET</p><h2 id="queue-title">同じ型を続けて練習</h2></div><p id="queue-copy">例文は同じチャンクごとに並びます。</p><ol id="queue-list" class="queue-list"></ol></section></div>
<section id="examples-view" class="examples-view" aria-labelledby="examples-title" hidden><div class="examples-toolbar"><div><h2 id="examples-title">例文一覧</h2><p id="examples-summary" class="examples-summary" aria-live="polite">教材を選択してください。</p></div><label class="example-search">検索<input id="example-search" type="search" placeholder="チャンク・英文・日本語" autocomplete="off" /></label></div><p id="examples-empty" class="examples-empty">教材を選択してください。</p><div id="examples-list" class="examples-list"></div></section></main></div><script src="./app-core.js?v=25"></script><script src="./install.js?v=25"></script></body></html>
